name: quarto_renderer
on: push
jobs:
  pipe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex:true
      
      - run: pip install ipykernel nbclient matplotlib PyMPDATA
      - run: quarto render *.ipynb --to-pdf --execute
      - uses: actions/uploaded-artifact@v7
        with:
          path: *.pdf
      
